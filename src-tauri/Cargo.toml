[package]
name = "loupe"
version = "0.1.0"
description = "An open-source desktop client for Kubernetes"
authors = ["The Loupe Authors"]
license = "Apache-2.0"
repository = "https://github.com/kryptonhq/loupe"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loupe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls avoids linking OpenSSL. "ring" is not optional alongside it:
# rustls 0.23 refuses to pick a crypto provider on its own, and without
# exactly one enabled the first connect panics with "Could not
# automatically determine the process-level CryptoProvider".
kube = { version = "4.2.0", default-features = false, features = ["client", "config", "runtime", "derive", "rustls-tls", "ring"] }
# The v1_XX feature pins which API surface is compiled in, not which
# clusters can be reached — the client stays compatible across versions.
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_33"] }
thiserror = "2.0.19"
futures = "0.3.33"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]

