name: ci

# Kept deliberately lean. The aggregate `ci` job at the bottom is the
# single status name to require in branch protection.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # Loupe uses the DCO rather than a CLA, so every commit must carry a
  # Signed-off-by line. Checked in CI because retrofitting sign-off
  # across a merged history is far more painful than catching it here.
  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the PR's commits, not just the merge commit.
          fetch-depth: 0

      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is missing a Signed-off-by line"
              missing=1
            elif ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              # A sign-off from someone other than the author is allowed
              # (co-authored work), so warn rather than fail.
              echo "::warning::$(git show -s --format='%h' "$sha") sign-off does not match the author ($author)"
            fi
          # `--no-merges` deliberately.
          #
          # A merge commit contributes no code: the contribution lives in
          # the commits it joins, and every one of those is checked here.
          # GitHub's "Update branch" button and its merge queue both
          # create merge commits attributed to whoever pressed the
          # button, with no sign-off — so requiring one turns a
          # one-click branch refresh into a permanently red DCO that can
          # only be cleared by rebasing and force-pushing. That happened
          # twice in one afternoon, including on a Dependabot PR whose
          # own commit was correctly signed off.
          #
          # This matches the DCO GitHub App, and the DCO itself: it is a
          # statement about authoring a contribution, not about
          # integrating one.
          done < <(git rev-list --no-merges "$BASE..$HEAD")

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Sign off your commits with: git commit -s"
            echo "To fix a branch:            git rebase --signoff ${BASE}"
            exit 1
          fi
          echo "All commits are signed off."

  # The three manifests that carry a version drift silently, and the
  # cost lands at release time when an installer is named after the
  # wrong one. Checked on every PR so it never gets that far.
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/version.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      # Tauri needs system webkit to build on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-llvm-cov

      # The cluster-backed tests are #[ignore]d and stay that way here:
      # CI has no cluster, and a test that silently needs one is worse
      # than a test that is honestly skipped. Coverage therefore reports
      # on what the unit tests reach, which is the honest number.
      #
      # llvm-cov runs the tests itself, so this is the test step too
      # rather than a second compile-and-run of the same suite.
      - name: Test
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml \
            --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          # A pull request from a fork cannot see the token, and a
          # contributor's PR should not go red because of it.
          fail_ci_if_error: false

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      # `pnpm build` runs tsc first, so this is the typecheck too.
      - run: pnpm build

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  ci:
    name: ci
    if: always()
    needs: [dco, version, rust, web]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          for name, job in sorted(needs.items()):
              print(f"  {job['result']:>10}  {name}")
          # dco is skipped on push; that is expected, not a failure.
          failed = sorted(
              n for n, j in needs.items()
              if j["result"] not in ("success", "skipped")
          )
          if failed:
              print(f"\nfailing: {', '.join(failed)}")
              sys.exit(1)
          print("\nall checks passed")
          PY
